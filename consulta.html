<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Candidatos e TAF - CBMPR CRS</title>
  <style>
    :root {
      --primary-color: #1e293b;
      --accent-color: #0284c7;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #334155;
      --border-color: #cbd5e1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 950px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    .header {
      background-color: var(--primary-color);
      color: #ffffff;
      padding: 1.5rem 2rem;
      border-bottom: 4px solid var(--accent-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .search-box {
      padding: 2rem;
      background-color: #f1f5f9;
      border-bottom: 1px solid var(--border-color);
    }

    .search-form {
      display: flex;
      gap: 1rem;
    }

    .search-form input {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
    }

    .search-form input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .btn {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      background-color: var(--accent-color);
      color: #ffffff;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #0369a1;
    }

    .results-container {
      padding: 2rem;
    }

    .candidato-card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      background-color: #fff;
    }

    .candidato-card h3 {
      color: var(--primary-color);
      margin-bottom: 0.5rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.5rem;
    }

    .grid-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .info-item {
      font-size: 0.9rem;
    }

    .info-item strong {
      color: #475569;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .badge-apto { background-color: #dcfce7; color: #166534; }
    .badge-inapto { background-color: #fee2e2; color: #991b1b; }
    .badge-nd { background-color: #f1f5f9; color: #64748b; }

    .loading, .empty {
      text-align: center;
      padding: 2rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div>
        <h1>Consulta de Candidatos & TAF</h1>
        <p style="font-size: 0.875rem; color: #94a3b8;">Pesquise por Código ID, Nome Completo ou CPF</p>
      </div>
    </div>

    <div class="search-box">
      <form class="search-form" id="formBusca">
        <input type="text" id="termoBusca" placeholder="Digite o Código ID (ex: CND-2026-001), Nome ou CPF..." required>
        <button type="submit" class="btn">Buscar</button>
      </form>
    </div>

    <div class="results-container" id="resultados">
      <div class="empty">Digite um parâmetro acima e clique em "Buscar".</div>
    </div>
  </div>

  <script>
    const formBusca = document.getElementById('formBusca');
    const resultadosDiv = document.getElementById('resultados');

    // Substitua pela sua URL real do Render
    const API_URL = 'https://cbm-palz.onrender.com/api/candidatos/buscar';

    formBusca.addEventListener('submit', async (e) => {
      e.preventDefault();
      const termo = document.getElementById('termoBusca').value.trim();

      resultadosDiv.innerHTML = '<div class="loading">Consultando banco de dados...</div>';

      try {
        const response = await fetch(`${API_URL}?termo=${encodeURIComponent(termo)}`);
        
        if (!response.ok) {
          throw new Error('Erro ao realizar consulta');
        }

        const candidatos = await response.json();

        if (candidatos.length === 0) {
          resultadosDiv.innerHTML = '<div class="empty">Nenhum candidato encontrado com o termo informado.</div>';
          return;
        }

        renderResultados(candidatos);

      } catch (error) {
        console.error('Erro:', error);
        resultadosDiv.innerHTML = '<div class="empty" style="color: #991b1b;">Erro ao conectar com o servidor. Verifique se a API está online.</div>';
      }
    });

    function renderResultados(candidatos) {
      resultadosDiv.innerHTML = candidatos.map(c => `
        <div class="candidato-card">
          <h3>${c.nome_completo} <small style="font-size: 0.8rem; color: #64748b;">(${c.codigo_candidato})</small></h3>
          
          <div class="grid-info">
            <div class="info-item"><strong>CPF:</strong> ${c.cpf}</div>
            <div class="info-item"><strong>E-mail:</strong> ${c.email}</div>
            <div class="info-item"><strong>Telefone:</strong> ${c.telefone}</div>
            <div class="info-item"><strong>Cidade/UF:</strong> ${c.cidade} / ${c.estado}</div>
          </div>

          <h4 style="margin-top: 1.25rem; font-size: 1rem; color: var(--accent-color);">Desempenho no TAF</h4>
          <div class="grid-info">
            <div class="info-item">
              <strong>Corrida 2.400m:</strong> ${c.corrida_tempo || 'N/A'} 
              ${getBadge(c.corrida_situacao)}
            </div>
            <div class="info-item">
              <strong>Barra Fixa:</strong> ${c.barra_qtd || 'N/A'} 
              ${getBadge(c.barra_situacao)}
            </div>
            <div class="info-item">
              <strong>Subida na Corda:</strong> ${c.corda_resultado || 'N/A'} 
              ${getBadge(c.corda_situacao)}
            </div>
            <div class="info-item">
              <strong>Trave Suspensa:</strong> ${c.trave_resultado || 'N/A'} 
              ${getBadge(c.trave_situacao)}
            </div>
          </div>
        </div>
      `).join('');
    }

    function getBadge(situacao) {
      if (situacao === 'Apto') return '<span class="badge badge-apto">Apto</span>';
      if (situacao === 'Inapto') return '<span class="badge badge-inapto">Inapto</span>';
      return '<span class="badge badge-nd">N/D</span>';
    }
  </script>
</body>
</html>
